{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="mb-4">
      <a href="{% url 'task_detail' task.id %}" class="text-decoration-none small">&larr; Back to {{ task.title }}</a>
      <h2 class="h4 fw-bold mt-2">{{ title }}</h2>
    </div>
    <div class="card-saas">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <label for="{{ form.title.id_for_label }}" class="form-label fw-semibold">Checklist item</label>
          {{ form.title }}
          {% if form.title.errors %}<div class="text-danger small mt-1">{{ form.title.errors.0 }}</div>{% endif %}
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'task_detail' task.id %}" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-primary">Save item</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
