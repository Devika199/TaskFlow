{% extends 'base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-saas border-danger p-4 text-center">
      <div class="d-inline-flex align-items-center justify-content-center mb-3 bg-danger-subtle text-danger rounded-circle" style="width: 56px; height: 56px;">
        <i class="bi bi-trash3-fill fs-3"></i>
      </div>
      <h4 class="fw-bold text-dark mb-2">Delete this task?</h4>
      <p class="text-secondary small mb-4">
        You are about to permanently delete <strong class="text-dark">"{{ task.title }}"</strong>. All associated comments and activity logs will also be permanently removed.
      </p>

      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'task_detail' task.id %}" class="btn btn-light border px-3">
            Cancel
          </a>
          <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash-fill me-1"></i>Confirm Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
