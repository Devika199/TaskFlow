{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 fw-bold mb-4">{{ title }}</h1>
    <div class="card-saas"><div class="card-body p-4">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <div class="d-flex justify-content-end gap-2">
          <a href="{% url 'projects' %}" class="btn btn-light border">Cancel</a>
          <button type="submit" class="btn btn-primary">Save project</button>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
