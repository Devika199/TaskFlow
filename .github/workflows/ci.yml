name: TaskFlow Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run System Checks and Tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-testing-dummy-secret-key-32-chars-long-prod-grade
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      GEMINI_API_KEY: "ci-dummy-gemini-key"
      ADMIN_REGISTRATION_CODE: "ci-test-admin-code"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: |
          python manage.py check

      - name: Verify migration consistency (no ungenerated migrations)
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: |
          python manage.py test --verbosity=2

