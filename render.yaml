services:
  - type: web
    name: taskflow
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn taskflow_core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_REGISTRATION_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: taskflow-db
    plan: free
    region: oregon
    databaseName: taskflow_db
    user: taskflow_user

